name: Build Windows Helper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - helper/**
      - .github/workflows/build-helper-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: helper/src/requirements.txt
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 -r helper/src/requirements.txt
      - name: Build Windows x64 processor
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name flow-local-processor
          --distpath helper/build
          --workpath helper/work
          --specpath .
          --collect-all imageio_ffmpeg
          --add-data "helper/src/default_targets.json;."
          --paths helper/src
          helper/src/server.py
      - name: Assemble installer package
        shell: pwsh
        run: |
          $package = "helper/package/Flow-Studio-Helper-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$package/processor" | Out-Null
          Copy-Item -Recurse -Force "helper/build/flow-local-processor/*" "$package/processor/"
          Copy-Item "helper/windows/Install-Flow-Studio-Helper.ps1" $package
          Copy-Item "helper/windows/Install-Flow-Studio-Helper.cmd" $package
          Copy-Item "helper/windows/README.txt" $package
          New-Item -ItemType Directory -Force -Path public/downloads | Out-Null
          Compress-Archive -Path $package -DestinationPath public/downloads/Flow-Studio-Helper-Windows-x64.zip -Force
      - name: Smoke test packaged helper
        shell: pwsh
        run: |
          $exe = "helper/package/Flow-Studio-Helper-Windows-x64/processor/flow-local-processor.exe"
          $data = Join-Path $env:RUNNER_TEMP "flow-helper-smoke"
          $process = Start-Process -FilePath $exe -ArgumentList "--port 43127 --data-dir `"$data`"" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $session = Invoke-RestMethod -Uri "http://127.0.0.1:43127/session" -Headers @{ Origin = "https://flow-studio-web-one.vercel.app" } -TimeoutSec 2
                if ($session.platform -eq "win32" -and $session.version -eq 12) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "Packaged Windows helper did not become ready." }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Studio-Helper-Windows-x64
          path: public/downloads/Flow-Studio-Helper-Windows-x64.zip
          if-no-files-found: error
